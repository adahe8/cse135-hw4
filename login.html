<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Analytics Dashboard</title>
    <link rel="icon" href="/book-icon.svg" type="image/svg+xml">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #020617;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            margin: 20px;
            position: relative;
            overflow: hidden;
        }

        .brand-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #38bdf8;
        }

        .login-card h1 {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #64748b;
            text-align: center;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #475569;
            font-size: 0.8rem;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #e2e8f0;
            font-size: 0.875rem;
            font-family: inherit;
            transition: border-color 0.15s;
        }

        .form-group input::placeholder { color: #334155; }
        .form-group input:focus { outline: none; border-color: #38bdf8; }

        .error {
            background: rgba(248, 113, 113, 0.08);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.8rem;
            margin-bottom: 18px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 9px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 4px;
        }

        button[type="submit"]:hover:not(:disabled) { background: #7dd3fc; }
        button[type="submit"]:disabled { opacity: 0.45; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-bar"></div>
        <form id="login-form">
            <h1>Analytics Dashboard</h1>
            <p class="subtitle">Sign in to view your reports</p>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com"
                       required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password"
                       required autocomplete="current-password">
            </div>

            <div id="error-message" class="error" hidden></div>

            <button type="submit">Sign In</button>
        </form>
    </div>

    <script>
    (function() {
        'use strict';

        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');
        const submitBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.hidden = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorDiv.textContent = data.error || 'Invalid email or password.';
                    errorDiv.hidden = false;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            } catch (err) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.hidden = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    })();
    </script>
</body>
</html>
